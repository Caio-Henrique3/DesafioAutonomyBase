version: '3.8'

services:
  db:
    image: postgres:16
    container_name: autonomy-base_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-autonomy-base}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - autonomy-base-net

  mongodb:
    image: mongo:7
    container_name: autonomy-base_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo}
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - autonomy-base-net

volumes:
  pgdata:
  mongodata:

networks:
  autonomy-base-net:
